name: Feature

on:
  push:
    branches-ignore: main
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: 'golang:1.26.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Tests
        run: go test -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.3
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Linters
        run: go vet -v ./...
  build:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.3
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build App
        run: go build -v ./main.go
