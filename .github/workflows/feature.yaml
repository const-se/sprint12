name: Feature

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: 'golang:1.25.0'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Run tests
        run: go test -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Run lint
        run: go vet -v ./...
  build:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Build app
        run: go build -v -o app main.go
