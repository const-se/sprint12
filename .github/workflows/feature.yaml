name: Feature

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: 'golang:1.25.0'
    steps:
      - uses: actions/checkout@v7
      - run: go test -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.0
      - uses: actions/checkout@v7
      - run: go vet -v ./...
  build:
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.0
      - uses: actions/checkout@v7
      - run: go build -o app.exe ./main.go
