name: Feature

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: 'golang:1.26.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: go build -v ./main.go
  tests:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.3
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: go test -v ./...
  lint:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.3
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: go vet -v ./...
