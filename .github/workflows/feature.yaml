name: Feature

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    container:
      image: 'golang:1.26.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - run: go test -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.3
      - uses: actions/checkout@v7
      - run: go vet -v ./...
  build:
    needs:
      - tests
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.3
      - uses: actions/checkout@v7
      - run: go build -o app.exe ./main.go
  
